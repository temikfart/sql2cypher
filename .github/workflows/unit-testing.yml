name: 'unit-testing'

on:
  push:
  pull_request:
    types:
      - reopened
      - ready_for_review
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  build-test-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo apt update
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt install -y cmake graphviz g++-13 gcc-13

      - uses: actions/checkout@v4

      - name: Configure
        env:
          CC: gcc-13
          CXX: g++-13
        run: cmake -S . -B build

      - name: Build
        run: cd build && cmake --build .

      - name: Unit testing
        run: cd build && ctest

  build-test-macos:
    runs-on: macos-latest
    steps:
      - name: Install dependencies
        run: |
          brew install cmake graphviz
          softwareupdate --install -a
          /usr/bin/xcodebuild -version

      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DEXPERIMENTAL=1

      - name: Build
        run: cd build && cmake --build .

      - name: Unit testing
        run: cd build && ctest
